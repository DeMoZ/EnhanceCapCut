# The platform-independent core shared by the macOS and Windows apps (openspec/changes/archive/2026-11-26-rust-core).
[workspace]
resolver = "2"
members = ["ecc-core", "ecc-ffi", "ecc-golden", "uniffi-bindgen"]

[workspace.package]
edition = "2021"
version = "0.1.0"
publish = false
license = "MIT"

[workspace.dependencies]
ecc-core = { path = "ecc-core" }
# float_roundtrip: parse floats exactly like Foundation's JSON decoders (correctly rounded).
serde_json = { version = "1", features = ["float_roundtrip"] }
uuid = { version = "1", features = ["v4"] }
unicode-segmentation = "1"
# Word breaks for Thai, Lao, Khmer and Burmese: LSTM data only (design decision 7).
icu_segmenter = { version = "2.4", default-features = false, features = ["compiled_data", "lstm"] }
# Exact: uniffi-bindgen-cs v0.12.0+v0.32.0 is built against uniffi_bindgen 0.32.0 (design decision 3).
uniffi = "=0.32.0"

# Design decision 2.
[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
debug = "line-tables-only"
