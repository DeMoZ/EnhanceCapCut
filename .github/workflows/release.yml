# Builds both versions and publishes a GitHub release when a version tag is pushed:
#   git tag v0.3.0 && git push origin v0.3.0
# The tag must match CFBundleShortVersionString in App/Info.plist (the version of both platforms).
# Release notes come from docs/releases/<tag>.md, or are generated from the merged PRs.
# appcast.xml (the Mac app's update feed, signed with the SPARKLE_PRIVATE_KEY secret) is published with the release.
# Run by hand (workflow_dispatch) or on a pull request that changes the packaging, it's a dry run: both installers are
# built and kept as artifacts for a few days, with their sizes in the job summary, and nothing is signed or published.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/build-app.sh'
      - 'scripts/build-core.sh'
      - 'core/Cargo.toml'
      - 'core/ecc-ffi/**'
      - 'windows/src/EnhanceCapCut.Draft/EnhanceCapCut.Draft.csproj'

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" App/Info.plist)
          [[ "v$version" == "$GITHUB_REF_NAME" ]] || { echo "::error::Tag $GITHUB_REF_NAME doesn't match App/Info.plist ($version)"; exit 1; }
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: core
      - name: Build the installer (with the Rust core, scripts/build-core.sh --universal)
        run: scripts/build-app.sh --pkg
      - name: Installer size
        run: |
          echo "macOS: $(ls build/EnhanceCapCut-*.pkg) $(stat -f %z build/EnhanceCapCut-*.pkg) bytes" | tee -a "$GITHUB_STEP_SUMMARY"
          lipo -info build/EnhanceCapCut.app/Contents/MacOS/ecc build/EnhanceCapCut.app/Contents/MacOS/EnhanceCapCut
      - name: Sign the update for Sparkle (build/appcast.xml)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: scripts/appcast.sh build/EnhanceCapCut-*.pkg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            build/EnhanceCapCut-*.pkg
            build/appcast.xml
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 90 || 3 }}

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x
      # EnhanceCapCut.Draft builds the Rust core (ecc_core.dll) with cargo for win-x64.
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: core
      - run: dotnet test windows/EnhanceCapCut.slnx -c Release
      - name: Build EnhanceCapCut.exe and ecc.exe
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version=${GITHUB_REF_NAME#v}
          else # a dry run: the version in App/Info.plist
            version=$(grep -A1 CFBundleShortVersionString App/Info.plist | sed -n 's:.*<string>\(.*\)</string>.*:\1:p')
          fi
          out=build/EnhanceCapCut-$version-windows-x64
          # The app and the CLI share one folder (the same .NET runtime and libraries).
          dotnet publish windows/src/EnhanceCapCut.App -r win-x64 --self-contained -c Release -p:Version=$version -o "$out"
          dotnet publish windows/src/ecc -f net10.0-windows10.0.19041.0 -r win-x64 --self-contained -c Release -p:Version=$version -o "$out"
          # Whisper.net ships native libraries for every platform: keep Windows x64 (CPU and Vulkan).
          find "$out/runtimes" -mindepth 1 -maxdepth 1 ! -name win-x64 ! -name vulkan -exec rm -rf {} +
          find "$out/runtimes/vulkan" -mindepth 1 -maxdepth 1 ! -name win-x64 -exec rm -rf {} +
          rm -f "$out"/*.pdb "$out"/*.lib "$out"/*.metal
          # The Rust core, copied by EnhanceCapCut.Draft's BuildRustCore target.
          test -f "$out/ecc_core.dll" || { echo "::error::ecc_core.dll is missing from $out"; exit 1; }
          cd build && 7z a -tzip "EnhanceCapCut-$version-windows-x64.zip" "EnhanceCapCut-$version-windows-x64" > /dev/null
          echo "Windows: EnhanceCapCut-$version-windows-x64.zip $(stat -c %s "EnhanceCapCut-$version-windows-x64.zip") bytes, ecc_core.dll $(stat -c %s "EnhanceCapCut-$version-windows-x64/ecc_core.dll") bytes" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/EnhanceCapCut-*-windows-x64.zip
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 90 || 3 }}

  release:
    needs: [macos, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=docs/releases/$GITHUB_REF_NAME.md
          if [[ -f "$notes" ]]; then args=(--notes-file "$notes"); else args=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" dist/* --title "EnhanceCapCut ${GITHUB_REF_NAME#v}" "${args[@]}"
