# Checks the Rust core (core/, openspec/changes/archive/2026-11-26-rust-core): formatting, lints and tests on Linux, the
# tests on Windows too (where the per-OS defaults, `cfg(windows)`, are compiled), and on macOS the Swift build and tests
# plus the golden check on the fixture projects (both CLIs print the core's `ecc info`, byte for byte). The toolchain
# comes from rust-toolchain.toml.
name: Core

on:
  push:
    branches: [main]
    paths: ['core/**', 'Localization/**', 'rust-toolchain.toml', '.github/workflows/core.yml', 'Sources/**', 'Tests/**', 'Package.swift', 'windows/src/**', 'scripts/golden.sh', 'scripts/build-core.sh', 'scripts/csharp-bindings.sh']
  pull_request:
    paths: ['core/**', 'Localization/**', 'rust-toolchain.toml', '.github/workflows/core.yml', 'Sources/**', 'Tests/**', 'Package.swift', 'windows/src/**', 'scripts/golden.sh', 'scripts/build-core.sh', 'scripts/csharp-bindings.sh']

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: core
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # The committed C# bindings must be what the pinned generator makes of the current API (design decision 3).
      - name: Install uniffi-bindgen-cs (pinned)
        run: |
          command -v uniffi-bindgen-cs >/dev/null || cargo install uniffi-bindgen-cs --locked \
            --git https://github.com/NordSecurity/uniffi-bindgen-cs --tag v0.12.0+v0.32.0
      - name: The C# bindings are current
        working-directory: .
        run: |
          scripts/csharp-bindings.sh
          git diff --exit-code windows/src/EnhanceCapCut.Draft/Generated || {
            echo "::error::Generated/ecc_core.cs is out of date: run scripts/csharp-bindings.sh and commit it"; exit 1; }

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: core
      - run: cargo test

  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: core
      - name: Build the Rust core for Swift
        run: scripts/build-core.sh
      - name: The Swift bindings are current
        run: |
          git diff --exit-code Sources/EccCore || {
            echo "::error::Sources/EccCore/EccCore.swift is out of date: run scripts/build-core.sh and commit it"; exit 1; }
      - run: swift build
      - run: swift test
      - name: Golden parity on the fixtures
        run: scripts/golden.sh fixtures
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: golden-diff
          path: build/golden/diff
          if-no-files-found: ignore
