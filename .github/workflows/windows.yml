# Builds and tests the Windows version (windows/, .NET) on Windows, checks that its `ecc info` prints what the Rust core
# prints on every OS (scripts/golden.sh fixtures against the committed expected outputs), then starts the app and keeps
# screenshots of its windows as the `windows-ui` artifact, and updates a published app from one version to the next.
name: Windows

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dotnet:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x
      # EnhanceCapCut.Draft builds the Rust core with cargo (toolchain from rust-toolchain.toml).
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: core
      - run: dotnet build windows/EnhanceCapCut.slnx -c Release
      - run: dotnet test windows/EnhanceCapCut.slnx -c Release --no-build
      - name: ecc info equals the core's on every fixture
        shell: bash
        run: SKIP_SWIFT=1 scripts/golden.sh fixtures
      - name: Publish the app
        run: dotnet publish windows/src/EnhanceCapCut.App -c Release -r win-x64 --self-contained -o build/app
      - name: The Rust core is in the published app
        shell: pwsh
        run: |
          if (-not (Test-Path build/app/ecc_core.dll)) { Write-Error "build/app has no ecc_core.dll"; exit 1 }
          "ecc_core.dll: {0:N1} MB" -f ((Get-Item build/app/ecc_core.dll).Length / 1MB)
      - name: Start the app
        shell: pwsh
        run: windows/scripts/ui-smoke.ps1 -App build/app -Out build/ui
      - name: Update the app
        shell: pwsh
        run: |
          dotnet publish windows/src/EnhanceCapCut.App -c Release -r win-x64 --self-contained -p:Version=0.0.1 -o build/update/old
          dotnet publish windows/src/EnhanceCapCut.App -c Release -r win-x64 --self-contained -p:Version=0.0.2 -o build/update/new
          windows/scripts/update-smoke.ps1 -Old build/update/old -New build/update/new -Work build/update/work
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-ui
          path: build/ui
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: golden-diff-windows
          path: build/golden/diff
          if-no-files-found: ignore
