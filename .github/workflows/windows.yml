# Builds and tests the Windows version (windows/, .NET) on Windows.
name: Windows

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dotnet:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet build windows/EnhanceCapCut.slnx -c Release
      - run: dotnet test windows/EnhanceCapCut.slnx -c Release --no-build
