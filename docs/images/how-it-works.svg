<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15142b"/>
      <stop offset="1" stop-color="#231c45"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3dd6ff"/>
      <stop offset="0.55" stop-color="#8f6bff"/>
      <stop offset="1" stop-color="#ff4fa3"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8f8ab8"/>
    </marker>
  </defs>
  <rect width="960" height="300" rx="20" fill="url(#bg)"/>

  <!-- CapCut project -->
  <rect x="36" y="100" width="200" height="100" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18"/>
  <text x="136" y="140" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="600">Your CapCut project</text>
  <text x="136" y="168" text-anchor="middle" fill="#b9b5d8" font-size="14">edit as usual</text>

  <line x1="244" y1="150" x2="320" y2="150" stroke="#8f8ab8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="282" y="138" text-anchor="middle" fill="#8f8ab8" font-size="12">1 click</text>

  <!-- EnhanceCapCut -->
  <rect x="328" y="86" width="230" height="128" rx="16" fill="url(#brand)"/>
  <text x="443" y="142" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="700">EnhanceCapCut</text>
  <text x="443" y="170" text-anchor="middle" fill="#ffffff" fill-opacity="0.9" font-size="14">on your Mac or PC, offline</text>

  <line x1="566" y1="130" x2="640" y2="70" stroke="#8f8ab8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="566" y1="150" x2="640" y2="150" stroke="#8f8ab8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="566" y1="170" x2="640" y2="230" stroke="#8f8ab8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Results -->
  <rect x="648" y="36" width="280" height="68" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#3dd6ff" stroke-opacity="0.7"/>
  <text x="668" y="64" fill="#ffffff" font-size="16" font-weight="600">🎬  Video, your way</text>
  <text x="668" y="88" fill="#b9b5d8" font-size="13">4K · HEVC 10-bit · ProRes · loudness</text>

  <rect x="648" y="116" width="280" height="68" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#8f6bff" stroke-opacity="0.8"/>
  <text x="668" y="144" fill="#ffffff" font-size="16" font-weight="600">💬  Subtitles in 20+ languages</text>
  <text x="668" y="168" fill="#b9b5d8" font-size="13">added back as CapCut caption tracks</text>

  <rect x="648" y="196" width="280" height="68" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#ff4fa3" stroke-opacity="0.8"/>
  <text x="668" y="224" fill="#ffffff" font-size="16" font-weight="600">🎙  Voice-over, even in your voice</text>
  <text x="668" y="248" fill="#b9b5d8" font-size="13">a new dubbed timeline in the project</text>
</svg>
